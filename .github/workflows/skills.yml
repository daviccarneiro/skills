name: Validar skills e atualizar catálogo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/catalog.py --validate-only

  update-catalog:
    needs: validate
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: skills-catalog-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Atualizar somente o catálogo do README
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin "$DEFAULT_BRANCH"
            git checkout -B catalog-update "origin/$DEFAULT_BRANCH"
            python -m pip install -r requirements-dev.txt
            python -m unittest discover -s tests -v
            python scripts/catalog.py
            python scripts/catalog.py --check
            git add -- README.md
            if git diff --cached --quiet; then
              echo 'Catálogo já está atualizado.'
              exit 0
            fi
            git commit -m 'docs: atualizar catálogo de skills'
            if git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"; then
              exit 0
            fi
            echo "Tentativa $attempt falhou; recalculando sobre a versão mais recente."
          done
          echo 'Não foi possível publicar o catálogo. Verifique permissões e regras da branch.' >&2
          exit 1
